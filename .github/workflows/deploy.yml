name: Deploy AI service

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: nexus-ai-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA" .
          docker push "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

      - name: Deploy to the host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd /opt/nexus-ai
            set -a; . .env; set +a
            aws ecr get-login-password --region us-east-1 |
              docker login --username AWS --password-stdin "$ECR_REGISTRY"
            sed -i '/^SERVICE_TAG=/d' .env
            echo "SERVICE_TAG=$GITHUB_SHA" >> .env
            docker compose pull ai-service
            docker compose up -d --no-deps ai-service
            # Drop images no longer referenced by a container so the disk
            # does not fill up with one image per deploy.
            docker image prune -af
            docker compose ps
