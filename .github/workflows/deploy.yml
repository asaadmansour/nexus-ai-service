name: Deploy AI service

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: nexus-ai-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA" .
          docker push "$ECR_REGISTRY/$IMAGE_NAME:$GITHUB_SHA"

      - name: Deploy to the host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            exec 9>/tmp/nexus-ai-deploy.lock
            flock -x 9
            cd /opt/nexus-ai
            set -a; . .env; set +a
            aws ecr get-login-password --region us-east-1 |
              docker login --username AWS --password-stdin "$ECR_REGISTRY"
            sed -i '/^SERVICE_TAG=/d' .env
            echo "SERVICE_TAG=$GITHUB_SHA" >> .env
            # Compose prefers an exported shell value over the updated .env file.
            # Refresh it here so this run cannot silently redeploy the old tag.
            export SERVICE_TAG="$GITHUB_SHA"
            docker compose pull ai-service
            docker compose up -d --no-deps ai-service
            expected_image="$ECR_REGISTRY/nexus-ai-service:$GITHUB_SHA"
            actual_image="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q ai-service)")"
            test "$actual_image" = "$expected_image"
            # Do not remove tagged images pulled by concurrent frontend/backend
            # deploys before their containers have been recreated.
            docker image prune -f
            docker compose ps
