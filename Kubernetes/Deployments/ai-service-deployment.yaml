apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ai-service
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - image: nexus-ai-service:local
        name: ai-service
        envFrom:
        - configMapRef:
            name: nexus-config
        - secretRef:
            name: nexus-secret
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
