apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-evaluation-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-evaluation-runner
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["ai-service"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-evaluation-runner
subjects:
- kind: ServiceAccount
  name: backend-evaluation-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-evaluation-runner
